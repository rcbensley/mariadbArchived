[SERVICE]
        Daemon off
        log_level info
        Parsers_file parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_PORT 2020

[OUTPUT]
        Name stdout
        Match mariadb.*

[INPUT]
        Name tail
        Path logs/error.log
        Tag mariadb.error
        Key message
        Parser json 
        Read_from_Head On
        Skip_Long_lines Off

[FILTER]
        name log_to_metrics
        match *
        tag mariadb_metric
        metric_mode counter
        metric_name error_counter
        metric_description error counter metric
        Flush_Interval_Sec 5

[OUTPUT]
        name prometheus_exporter
        match *
        host 0.0.0.0
        port 2021

